
name: Publish

on:
  push:
    branches:
      - main
    paths:
      - 'extension/flux/**'
      - 'src/**'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Set up Node 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Set up vsce
      run: npm install -g vsce
    - name: Set up JDK 21
      uses: actions/setup-java@v1
      with:
        java-version: 21
    - name: Build with Gradle
      run: |
        chmod +x gradlew
        ./gradlew build
    - name: Create flux extension
      working-directory: extension/flux/
      run: |
        npm install
        vsce package -o flux.vsix
    - name: Pushes vsix to GitHub Pages
      uses: dmnemec/copy_file_to_another_repo_action@v1.0.4
      env:
        API_TOKEN_GITHUB: ${{ secrets.API_TOKEN_GITHUB }}
      with:
        source_file: 'extension/flux/flux.vsix'
        destination_repo: 'metafacture/metafacture.github.io'
        destination_branch: main
        destination_folder: 'ide-extensions'
        user_email: '${{ github.actor }}@users.noreply.github.com'
        user_name: '${{ github.actor }}'
