plugins {
    id 'java'
    id 'org.springframework.boot' version '2.7.18'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'com.diffplug.spotless' version '8.0.0'
}

group = 'org.metafacture.lsp'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.eclipse.lsp4j:org.eclipse.lsp4j:0.21.0'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.reflections:reflections:0.10.2'
    implementation 'org.metafacture:metafacture-biblio:9.0.0'
    implementation 'org.metafacture:metafacture-commons:9.0.0'
    implementation 'org.metafacture:metafacture-csv:9.0.0'
    implementation 'org.metafacture:metafacture-elasticsearch:9.0.0'
    implementation 'org.metafacture:metafacture-files:9.0.0'
    implementation 'org.metafacture:metafacture-flowcontrol:9.0.0'
    implementation 'org.metafacture:metafacture-formatting:9.0.0'
    implementation 'org.metafacture:metafacture-formeta:9.0.0'
    implementation 'org.metafacture:metafacture-framework:9.0.0'
    implementation 'org.metafacture:metafacture-html:9.0.0'
    implementation 'org.metafacture:metafacture-io:9.0.0'
    implementation 'org.metafacture:metafacture-javaintegration:9.0.0'
    implementation 'org.metafacture:metafacture-jdom:9.0.0'
    implementation 'org.metafacture:metafacture-json:9.0.0'
    implementation 'org.metafacture:metafacture-linkeddata:9.0.0'
    implementation 'org.metafacture:metafacture-mangling:9.0.0'
    implementation 'org.metafacture:metafacture-monitoring:9.0.0'
    implementation 'org.metafacture:metafacture-plumbing:9.0.0'
    implementation 'org.metafacture:metafacture-runner:9.0.0'
    implementation 'org.metafacture:metafacture-scripting:9.0.0'
    implementation 'org.metafacture:metafacture-statistics:9.0.0'
    implementation 'org.metafacture:metafacture-strings:9.0.0'
    implementation 'org.metafacture:metafacture-triples:9.0.0'
    implementation 'org.metafacture:metafacture-xml:9.0.0'
    implementation 'org.metafacture:metafacture-yaml:9.0.0'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    developmentOnly("org.springframework.boot:spring-boot-devtools")
}

tasks.withType(Test) {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
    }
}

bootJar {
    archiveFileName = 'metafacture-lsp-0.0.1-SNAPSHOT.jar'
}

spotless {

    java {
        target 'src/*/java/**/*.java'
        removeUnusedImports()
        forbidWildcardImports()
        formatAnnotations()
        googleJavaFormat().aosp().reflowLongStrings()
    }

    flexmark {
        target '*.md', 'src/**/*.md'
        flexmark()
    }

    format 'misc', {
        target '*.gradle', '.gitignore'
        trimTrailingWhitespace()
        leadingTabsToSpaces()
        endWithNewline()
    }
}
